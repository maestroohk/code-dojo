x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  bourbon:
    <<: *node
    hostname: bourbon
    tmpfs: ["/srv/data:size=64m"]
    environment:
      DOJO_TOP: "${DOJO_TOP}"
    networks: { office: { ipv4_address: 10.36.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.36.1.0/24, gateway: 10.36.1.1 } ] }
