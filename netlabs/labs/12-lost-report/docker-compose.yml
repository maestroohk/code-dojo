x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  custard:
    <<: *node
    hostname: custard
    environment:
      DOJO_SEED: "${DOJO_SEED}"
      DOJO_NCSV: "${DOJO_NCSV}"
      DOJO_BIG: "${DOJO_BIG}"
      DOJO_RECENT: "${DOJO_RECENT}"
      DOJO_INDEX: "${DOJO_INDEX}"
    networks: { office: { ipv4_address: 10.32.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.32.1.0/24, gateway: 10.32.1.1 } ] }
