x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  shortbread:
    <<: *node
    hostname: shortbread
    environment:
      DOJO_FLAG: "${DOJO_FLAG}"
      DOJO_CHAPTERS: "${DOJO_CHAPTERS}"
      DOJO_TEMP: "${DOJO_TEMP}"
      DOJO_KEYDIR: "${DOJO_KEYDIR}"
    networks: { office: { ipv4_address: 10.31.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.31.1.0/24, gateway: 10.31.1.1 } ] }
