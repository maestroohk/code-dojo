x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  biscotti:
    <<: *node
    hostname: biscotti
    cpus: 0.5          # the thumbnailer is a real CPU hog: keep it to half a core
    tmpfs: ["/srv/shop/data:size=32m"]
    environment:
      DOJO_PORT: "${DOJO_PORT}"
      DOJO_COREPID: "${DOJO_COREPID}"
    networks: { office: { ipv4_address: 10.42.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.42.1.0/24, gateway: 10.42.1.1 } ] }
