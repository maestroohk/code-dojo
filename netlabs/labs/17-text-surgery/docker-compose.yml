x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  garibaldi:
    <<: *node
    hostname: garibaldi
    environment:
      DOJO_SEED: "${DOJO_SEED}"
      DOJO_CITY: "${DOJO_CITY}"
    networks: { office: { ipv4_address: 10.37.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.37.1.0/24, gateway: 10.37.1.1 } ] }
