x-kafka-env: &kenv
  PATH: /opt/kafka/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

services:
  kafka:
    image: apache/kafka:4.4.0
    hostname: kafka
    user: root
    init: true
    mem_limit: 768m
    environment:
      <<: *kenv
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 15000
      # A small heap: the broker needs little for a lab, and the CLI tools run in this container inherit it.
      KAFKA_HEAP_OPTS: "-Xmx448m -Xms128m"
    volumes: ["./files:/lab:ro"]
    networks: { stream: { ipv4_address: 10.63.1.10 } }
  ops:
    image: apache/kafka:4.4.0
    hostname: ops
    user: root
    init: true
    entrypoint: ["bash", "/lab/run-ops.sh"]
    mem_limit: 512m
    environment:
      <<: *kenv
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms64m"
      DOJO_SHIPOFF: "${DOJO_SHIPOFF}"
      DOJO_BILLOFF: "${DOJO_BILLOFF}"
    volumes: ["./files:/lab:ro"]
    networks: { stream: { ipv4_address: 10.63.1.20 } }

# internal: no way out to the internet, so nothing in the lab can quietly depend on it.
networks:
  stream:
    internal: true
    ipam: { config: [ { subnet: 10.63.1.0/24, gateway: 10.63.1.1 } ] }
