x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro", "keydrop:/keydrop"]

services:
  laptop:
    <<: *node
    hostname: laptop
    networks: { office: { ipv4_address: 10.40.1.20 } }
  wafer:
    <<: *node
    hostname: wafer
    environment:
      DOJO_SNEAKY: "${DOJO_SNEAKY}"
    networks: { office: { ipv4_address: 10.40.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.40.1.0/24, gateway: 10.40.1.1 } ] }

# Hands marvin's old private key from wafer to laptop at boot (as if he had always had it).
volumes:
  keydrop: {}
