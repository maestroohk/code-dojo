# Loki 3.7, single process, everything in memory or on the container's disk: right for a laptop lab,
# never for production. Logs arrive over OTLP from the Collector (http://loki:3100/otlp); OpenTelemetry
# resource attributes such as service.name become labels (service_name), and trace_id / span_id are kept as
# structured metadata, so `{service_name="shop"} | trace_id="..."` finds a trace's log lines.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 20

analytics:
  reporting_enabled: false
