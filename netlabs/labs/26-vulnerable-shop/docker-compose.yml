# The vulnerable shop lab. Every network is internal: nothing in it can reach the internet, and nothing outside
# Docker can reach it (no ports are published). The attacks in this lab only ever target these containers.
x-tools: &tools
  image: dojo-websec-tools:1
  build: { context: ., dockerfile: image/tools/Dockerfile }
  init: true
  volumes: ["./files:/lab:ro"]

services:
  attacker:
    <<: *tools
    hostname: attacker
    command: ["bash", "/lab/init/attacker.sh"]
    environment:
      PATH: /lab/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    networks:
      edge: { ipv4_address: 10.66.1.10 }
  shop:
    image: dojo-websec-shop:1
    build: { context: ., dockerfile: image/shop/Dockerfile }
    hostname: shop
    init: true
    command: ["bash", "-c", "bash /lab/init/shop.sh; exec sleep infinity"]
    mem_limit: 1536m
    cpus: 2
    environment:
      PATH: /lab/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DOJO_ADMINPW: "${DOJO_ADMINPW}"
      DOJO_BOBPW: "${DOJO_BOBPW}"
      DOJO_CAROLPW: "${DOJO_CAROLPW}"
      DOJO_PIN: "${DOJO_PIN}"
      DOJO_GATECODE: "${DOJO_GATECODE}"
      DOJO_PAYKEY: "${DOJO_PAYKEY}"
      DOJO_DEPLOY: "${DOJO_DEPLOY}"
    extra_hosts:
      - "cdn.shop.example:10.66.2.40"
      - "payments.internal:10.66.2.40"
    volumes: ["./files:/lab:ro", "work:/work"]
    networks:
      edge: { ipv4_address: 10.66.1.20 }
      backend: { ipv4_address: 10.66.2.20 }
      cloud: { ipv4_address: 169.254.169.10 }
  bot:
    <<: *tools
    hostname: bot
    command: ["bash", "/lab/init/bot.sh"]
    mem_limit: 1024m
    shm_size: 256m
    environment:
      PATH: /lab/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DOJO_ADMINPW: "${DOJO_ADMINPW}"
    networks:
      edge: { ipv4_address: 10.66.1.30 }
  internal:
    <<: *tools
    hostname: internal
    command: ["bash", "/lab/init/internal.sh"]
    environment:
      DOJO_AKID: "${DOJO_AKID}"
      DOJO_PAYKEY: "${DOJO_PAYKEY}"
    networks:
      backend: { ipv4_address: 10.66.2.40 }
      cloud: { ipv4_address: 169.254.169.254 }

volumes:
  work:

# internal: no way out to the internet, so nothing in the lab can quietly depend on it (or reach anyone else).
networks:
  edge:
    internal: true
    ipam: { config: [ { subnet: 10.66.1.0/24, gateway: 10.66.1.1 } ] }
  backend:
    internal: true
    ipam: { config: [ { subnet: 10.66.2.0/24, gateway: 10.66.2.1 } ] }
  cloud:
    internal: true
    ipam: { config: [ { subnet: 169.254.169.0/24, gateway: 169.254.169.1 } ] }
