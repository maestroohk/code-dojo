# Not part of the lab: other things a learner may reasonably try (JSONPath, the log and seda
# components, a timer, a filter), so their jars are in the image too.
- route:
    id: warm-extras
    from:
      uri: timer:warm
      parameters:
        repeatCount: 1
      steps:
        - setBody:
            constant: '{"type":"physical","orderId":"W-1","items":[{"sku":"LAMP-01","quantity":1}]}'
        - setHeader:
            name: orderType
            jsonpath: "$.type"
        - filter:
            simple: "${header.orderType} == 'physical'"
            steps:
              - to: log:warm
        - to: seda:warm
        - convertBodyTo:
            type: String
        - unmarshal:
            json: {}
        - transform:
            jq: '{reference: .orderId}'
        - marshal:
            json: {}
        - to: file:/tmp/warm
