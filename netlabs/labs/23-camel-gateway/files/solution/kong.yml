# Kong API gateway, DB-less mode: this file IS the whole gateway configuration.
# Edit it on ops, then run: gw-apply
#
# A service is a backend Kong can call. A route says which requests go to that service.
_format_version: "3.0"

services:
  - name: orders
    url: http://camel:8080/orders
    routes:
      - name: orders
        paths:
          - /api/orders
    plugins:
      - name: key-auth
        config:
          hide_credentials: true
      - name: rate-limiting
        config:
          minute: 5
          policy: local

  - name: stock
    url: http://warehouse:9000/stock
    routes:
      - name: stock
        paths:
          - /api/stock
    plugins:
      - name: response-transformer
        config:
          remove:
            headers:
              - X-Internal-Host

consumers:
  - username: corner-shop
    keyauth_credentials:
      - key: ck-KEY
