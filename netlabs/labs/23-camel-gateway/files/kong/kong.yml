# Kong API gateway, DB-less mode: this file IS the whole gateway configuration.
# Edit it on ops, then run: gw-apply
#
# A service is a backend Kong can call. A route says which requests go to that service.
_format_version: "3.0"

services:
  - name: orders
    url: http://camel:8080/orders
    routes:
      - name: orders
        paths:
          - /api/orders
