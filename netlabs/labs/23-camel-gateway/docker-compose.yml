x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  client:
    <<: *node
    hostname: client
    networks: { edge: { ipv4_address: 10.60.1.10 } }
  gateway:
    image: kong:3.9.5
    hostname: gateway
    init: true
    entrypoint: ["bash", "/lab/run-gateway.sh"]
    mem_limit: 384m
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /work/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 127.0.0.1:8001, 10.60.2.20:8001
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_MEM_CACHE_SIZE: 32m
      KONG_ANONYMOUS_REPORTS: "off"
      KONG_PROXY_ACCESS_LOG: /work/logs/gateway-access.log
      KONG_PROXY_ERROR_LOG: /work/logs/gateway-error.log
      KONG_ADMIN_ACCESS_LOG: "off"
    volumes: ["./files:/lab:ro", "work:/work"]
    networks:
      edge: { ipv4_address: 10.60.1.20 }
      backend: { ipv4_address: 10.60.2.20 }
  camel:
    image: dojo-camel-lab:4.22.1
    build: { context: ., dockerfile: image/Dockerfile }
    hostname: camel
    init: true
    entrypoint: ["bash", "/lab/run-camel.sh"]
    mem_limit: 768m
    environment:
      PATH: /lab/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/jbang
    volumes: ["./files:/lab:ro", "work:/work"]
    networks: { backend: { ipv4_address: 10.60.2.30 } }
  warehouse:
    <<: *node
    hostname: warehouse
    environment: { DOJO_ERRCODE: "${DOJO_ERRCODE}" }
    networks: { backend: { ipv4_address: 10.60.2.40 } }
  payments:
    <<: *node
    hostname: payments
    networks: { backend: { ipv4_address: 10.60.2.50 } }
  ops:
    <<: *node
    hostname: ops
    volumes: ["./files:/lab:ro", "work:/work"]
    networks: { backend: { ipv4_address: 10.60.2.10 } }

volumes:
  work:

# internal: no way out to the internet, so nothing in the lab can quietly depend on it.
networks:
  edge:
    internal: true
    ipam: { config: [ { subnet: 10.60.1.0/24, gateway: 10.60.1.1 } ] }
  backend:
    internal: true
    ipam: { config: [ { subnet: 10.60.2.0/24, gateway: 10.60.2.1 } ] }
