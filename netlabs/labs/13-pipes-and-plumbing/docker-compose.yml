x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  hobnob:
    <<: *node
    hostname: hobnob
    environment:
      DOJO_SEED: "${DOJO_SEED}"
      DOJO_FAV: "${DOJO_FAV}"
      DOJO_GRUMPY: "${DOJO_GRUMPY}"
    networks: { office: { ipv4_address: 10.33.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.33.1.0/24, gateway: 10.33.1.1 } ] }
