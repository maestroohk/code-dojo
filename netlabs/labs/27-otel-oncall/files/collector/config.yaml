# OpenTelemetry Collector (contrib 0.166) for the shop: one gateway that receives OTLP from both services
# and fans the three signals out to Jaeger (traces), Prometheus (metrics) and Loki (logs).
# Saving this file validates it and restarts the Collector (see /work/logs/collector.log).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuse data before the Collector runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 120
    spike_limit_mib: 25

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
    sending_queue:
      batch:
        enabled: true
  # Prometheus scrapes this endpoint (http://collector:8889/metrics). Series that stop
  # arriving are dropped after metric_expiration.
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 1m
    enable_open_metrics: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    sending_queue:
      batch:
        enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_grpc/jaeger]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      level: basic
