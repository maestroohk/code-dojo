# The shop's alerts, as the previous on-call left them.
groups:
  - name: shop
    rules:
      # Pages on every short spike: one slow request in a quiet minute is enough. Nobody trusts it any more.
      - alert: ShopSlowRequest
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="shop"}[1m]))) > 0.02
        labels:
          severity: page
        annotations:
          summary: "A shop request was slow"
