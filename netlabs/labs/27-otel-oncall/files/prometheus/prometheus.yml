# Prometheus 3.16 for the lab. It scrapes the Collector's Prometheus exporter, where the shop's OTLP
# metrics end up, and loads alerting rules from /work/prometheus/rules (edit them on ops, check them with
# promtool on this node, then reload: curl -X POST http://prometheus:9090/-/reload).
global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /work/prometheus/rules/*.yml

scrape_configs:
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["collector:8889"]
