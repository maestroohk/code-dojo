services:
  rabbit:
    image: rabbitmq:4.4.1-management
    hostname: rabbit
    init: true
    mem_limit: 512m
    volumes:
      - "./files:/lab:ro"
      - "./files/rabbit/10-lab.conf:/etc/rabbitmq/conf.d/10-lab.conf:ro"
      - "./files/rabbit/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"
    networks: { msg: { ipv4_address: 10.62.1.10 } }
  ops:
    image: dojo-toolbox:latest
    hostname: ops
    init: true
    environment: { DOJO_DLQN: "${DOJO_DLQN}" }
    volumes: ["./files:/lab:ro", "work:/work"]
    networks: { msg: { ipv4_address: 10.62.1.20 } }
  apps:
    image: dojo-rabbit-apps:4.4.1
    build: { context: ., dockerfile: image/Dockerfile }
    hostname: apps
    init: true
    volumes: ["./files:/lab:ro", "work:/work"]
    networks: { msg: { ipv4_address: 10.62.1.30 } }

volumes:
  work:

# internal: no way out to the internet, so nothing in the lab can quietly depend on it.
networks:
  msg:
    internal: true
    ipam: { config: [ { subnet: 10.62.1.0/24, gateway: 10.62.1.1 } ] }
