x-node: &node
  image: dojo-toolbox:latest
  init: true
  cap_add: [NET_ADMIN]
  volumes: ["./files:/lab:ro"]

services:
  jammie:
    <<: *node
    hostname: jammie
    environment:
      DOJO_MODE: "${DOJO_MODE}"
      DOJO_OWNER: "${DOJO_OWNER}"
    networks: { office: { ipv4_address: 10.34.1.10 } }

networks:
  office:
    driver_opts: { com.docker.network.bridge.enable_ip_masquerade: "false" }
    ipam: { config: [ { subnet: 10.34.1.0/24, gateway: 10.34.1.1 } ] }
