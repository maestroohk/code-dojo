<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>code-dojo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23d9773f'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='white'%3E%7B%7D%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- The boot screen: shown until the app has its topics and your progress. -->
    <div class="boot" id="boot">
      <div class="boot-mark" aria-hidden="true"><span>{</span><span class="boot-cursor"></span><span>}</span></div>
      <div class="boot-name">code-dojo</div>
      <div class="boot-hud" id="boot-hud" hidden>
        <div><b id="boot-streak">0</b><span>day streak 🔥</span></div>
        <div><b id="boot-level">1</b><span id="boot-rank">level</span></div>
        <div><b id="boot-xp">0</b><span>total XP</span></div>
      </div>
      <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
      <div class="boot-stage" id="boot-stage">Waking the dojo…</div>
      <div class="boot-tip">
        <div class="boot-tip-head">Did you know?</div>
        <div id="boot-tip"></div>
      </div>
    </div>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script src="tips.js"></script>
  <script>
    // Runs before the app: your numbers from last time, a fact to read, and a first bit of progress.
    (function () {
      try {
        var hud = JSON.parse(localStorage.getItem('dojo-hud') || 'null');
        if (hud) {
          document.getElementById('boot-streak').textContent = hud.streak;
          document.getElementById('boot-level').textContent = hud.level;
          document.getElementById('boot-rank').textContent = 'level · ' + hud.rank;
          document.getElementById('boot-xp').textContent = Number(hud.xp).toLocaleString();
          document.getElementById('boot-hud').hidden = false;
        }
        var size = localStorage.getItem('dojo-text-size');
        if (size) document.documentElement.dataset.size = size;
        var accent = localStorage.getItem('dojo-accent');   // the accent theme chosen in Profile
        if (accent && accent !== 'copper') document.documentElement.dataset.accent = accent;
      } catch (e) {}
      var tips = window.DOJO_TIPS || [];
      if (tips.length) document.getElementById('boot-tip').innerHTML = tips[Math.floor(Math.random() * tips.length)];
      window.dojoBoot = function (pct, text) {
        var f = document.getElementById('boot-fill'), s = document.getElementById('boot-stage');
        if (f) f.style.width = pct + '%';
        if (s && text) s.textContent = text;
      };
      window.dojoBoot(15, 'Waking the dojo…');
    })();
  </script>
  <script type="module" src="app.js"></script>
</body>
</html>
